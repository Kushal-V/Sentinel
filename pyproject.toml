[project]
name = "sentinel"
version = "1.0.0"
description = "Supply Chain Digital Twin — Multi-Agent Orchestration with Gemini 2.0 Flash"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.32.0",
    "pandas>=2.2.0",
    "pydantic>=2.6.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-google-genai>=1.0.0",
    "langchain-community>=0.2.0",
    "plotly>=5.20.0",
    "networkx>=3.2.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "faker>=40.5.1",
    "langchain-openai>=1.1.10",
    "langchain-groq>=1.1.2",
    "langchain-anthropic>=1.3.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]
