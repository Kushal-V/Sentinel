[project]
name = "sentinel"
version = "1.0.0"
description = "Supply Chain Digital Twin — Multi-Agent LLM Orchestration with Groq/Llama"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.32.0",
    "pandas>=2.2.0",
    "pydantic>=2.6.0",
    "langchain>=1.0.0,<2.0",
    "langchain-core>=1.2.8,<2.0",
    "langchain-groq>=1.1.2",
    "langgraph>=0.3.0",
    "langfuse>=3.0.0",
    "plotly>=5.20.0",
    "python-dotenv>=1.0.0",
    "faker>=4.0.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3.0",
    "mcp>=1.0.0",
]

[project.scripts]
sentinel-mcp = "src.mcp_server.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
markers = [
    "eval: opt-in evaluation tests, run with `pytest -m eval`",
]
