[project]
name = "sentinel"
version = "1.0.0"
description = "Supply Chain Digital Twin — Multi-Agent LLM Orchestration with Groq/Llama"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.32.0",
    "pandas>=2.2.0",
    "pydantic>=2.6.0",
    "langchain>=0.2.0,<0.4",
    "langchain-core>=0.2.0,<0.4",
    "langchain-groq>=1.1.2",
    "plotly>=5.20.0",
    "python-dotenv>=1.0.0",
    "faker>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]
